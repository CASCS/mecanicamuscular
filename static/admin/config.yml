backend:
  name: github
  repo: TU-USUARIO/TU-REPOSITORIO   # cámbialo por tu repositorio de GitHub
  branch: main

locale: es
media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Artículos
    label_singular: Artículo
    folder: content/posts
    extension: md
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Fecha, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]" }
      - { label: Resumen, name: description, widget: text, hint: "Aparece en las tarjetas y en los resultados de búsqueda." }
      - { label: Imagen de portada, name: image, widget: image, required: false }
      - label: Audio (opcional)
        name: audio
        widget: file
        required: false
        media_folder: /static/audio
        public_folder: /audio
        hint: "Opcional. Sube una grabación en MP3 o pega su enlace para que el artículo muestre un reproductor. Si la dejas vacía, no se muestra ninguno."
      - { label: Etiquetas, name: tags, widget: list, required: false }
      - { label: Destacado, name: featured, widget: boolean, default: false, hint: "Los destacados aparecen arriba en la portada." }
      - { label: Borrador, name: draft, widget: boolean, default: false }
      - { label: Texto, name: body, widget: markdown }

  - name: pages
    label: Páginas
    label_singular: Página
    folder: content/pages
    extension: md
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Resumen, name: description, widget: text, required: false }
      - { label: Diseño, name: layout, widget: select, options: [{ label: Normal, value: "" }, { label: "Perfil (CV académico)", value: profile }], default: "", required: false, hint: "Usa «Perfil» solo en la página Sobre mí; toma sus datos de Ajustes → Perfil." }
      - { label: Texto, name: body, widget: markdown }

  - name: settings
    label: Ajustes
    files:
      - name: site
        label: Sitio
        file: content/settings/site.json
        fields:
          - { label: Nombre del blog, name: title, widget: string }
          - { label: Titular de la portada, name: tagline, widget: string }
          - { label: Botón secundario de la portada (texto), name: hero_link_label, widget: string, required: false }
          - { label: Botón secundario de la portada (enlace), name: hero_link_url, widget: string, required: false }
          - { label: Descripción, name: description, widget: text }
          - { label: Idioma (código), name: lang, widget: string, default: es }
          - { label: Dirección del sitio, name: url, widget: string, required: false, hint: "Ejemplo: https://miblog.com (se usa para RSS y sitemap)." }
          - { label: Autor, name: author, widget: string }
          - { label: Color de acento, name: accent, widget: color }
          - { label: Enlace de suscripción, name: subscribe_url, widget: string, required: false, hint: "Si lo dejas vacío, el botón Suscribirse se oculta." }
          - label: Menú
            name: nav
            widget: list
            fields:
              - { label: Texto, name: label, widget: string }
              - { label: Enlace, name: url, widget: string }
          - label: Redes sociales
            name: social
            widget: list
            required: false
            fields:
              - { label: Nombre, name: label, widget: string }
              - { label: Enlace, name: url, widget: string }
          - { label: Nota del pie, name: footer_note, widget: string, required: false }
      - name: profile
        label: Perfil (Sobre mí)
        file: content/settings/profile.json
        fields:
          - { label: Nombre, name: name, widget: string }
          - { label: Titular (cargo o grado), name: headline, widget: string, required: false }
          - { label: Ubicación, name: location, widget: string, required: false }
          - { label: Foto, name: photo, widget: image, required: false, hint: "Si la dejas vacía se muestran tus iniciales." }
          - label: Enlaces principales
            name: links
            widget: list
            required: false
            hint: "ORCID, Google Scholar, ResearchGate, LinkedIn, correo (puedes escribir solo el correo)…"
            fields:
              - { label: Texto, name: label, widget: string }
              - { label: Enlace, name: url, widget: string }
          - { label: Datos destacados, name: highlights, widget: list, required: false, field: { label: Dato, name: item, widget: string } }
          - { label: Intereses, name: interests, widget: list, required: false, field: { label: Interés, name: item, widget: string } }
          - label: Formación
            name: education
            widget: list
            required: false
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Institución, name: place, widget: string, required: false }
              - { label: Años, name: years, widget: string, required: false }
          - { label: Introducción a la investigación, name: research_intro, widget: text, required: false }
          - label: Enlaces de investigación
            name: research_links
            widget: list
            required: false
            fields:
              - { label: Texto, name: label, widget: string }
              - { label: Enlace, name: url, widget: string }
          - label: Publicaciones
            name: publications
            widget: list
            required: false
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Autores, name: authors, widget: string, required: false, hint: "Tu nombre se resalta solo." }
              - { label: Revista o congreso, name: venue, widget: string, required: false }
              - { label: Año, name: year, widget: string, required: false }
              - { label: Tipo, name: kind, widget: string, required: false, hint: "Artículo, Congreso, Preprint…" }
              - label: Enlaces
                name: links
                widget: list
                required: false
                hint: "El primero es el del título. Ej.: DOI, PDF, Datos."
                fields:
                  - { label: Texto, name: label, widget: string }
                  - { label: Enlace, name: url, widget: string }
          - label: Libros
            name: books
            widget: list
            required: false
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Año, name: year, widget: string, required: false }
              - { label: Portada, name: cover, widget: image, required: false }
              - { label: Descripción, name: description, widget: text, required: false }
              - { label: Enlace, name: url, widget: string, required: false }
              - { label: Texto del botón, name: label, widget: string, required: false, default: Ver libro }
          - label: Proyectos
            name: projects
            widget: list
            required: false
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descripción, name: description, widget: text, required: false }
              - { label: Enlace, name: url, widget: string, required: false }
              - { label: Texto del botón, name: label, widget: string, required: false }
